name: AppImage

# Builds the AppImage from the current tree and starts it in stock Debian,
# Ubuntu and Fedora containers. The release workflow packages the AppImage
# itself from the binaries it builds (.github/actions/appimage); this workflow
# only proves the packaging whenever it changes, so it does not compile on
# every push. Details in packaging/appimage/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'packaging/appimage/**'
      - '.github/actions/appimage/**'
      - '.github/workflows/appimage.yml'
      - 'src/sandbox.rs'
      - 'src/sandbox/**'
  pull_request:
    paths:
      - 'packaging/appimage/**'
      - '.github/actions/appimage/**'
      - '.github/workflows/appimage.yml'
      - 'src/sandbox.rs'
      - 'src/sandbox/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RELEASE_RUST_VERSION: 1.98.0

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native development libraries
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install --yes libfontconfig1-dev libgtk-4-dev libgtksourceview-5-dev libpoppler-glib-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RELEASE_RUST_VERSION }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: appimage

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package the AppImage
        uses: ./.github/actions/appimage
        with:
          binary: target/release/strata
          name: strata-${{ github.sha }}-x86_64-unknown-linux-gnu
          output: dist

      - name: Upload the AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strata-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  test:
    name: Test on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Different glibc versions and families, none with GTK installed:
        # Debian 13 (glibc 2.41, and given its own GTK 4 stack to prove the
        # bundle ignores it), Ubuntu 22.04 (2.35, older than the build host),
        # Fedora.
        include:
          - image: debian:trixie-slim
            hostile_gtk: '1'
          - image: ubuntu:22.04
          - image: fedora:latest
    steps:
      - name: Check out the test script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging/appimage

      - name: Download the AppImage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: strata-appimage

      - name: Run the AppImage in a stock container
        # --privileged: the preview sandbox check runs bubblewrap, which needs
        # user namespaces that Docker's default seccomp profile blocks.
        run: |
          mkdir -p results
          docker run --rm --privileged -e HOSTILE_GTK="${{ matrix.hostile_gtk }}" \
            -v "$PWD:/work" -w /work "${{ matrix.image }}" \
            bash -c 'packaging/appimage/test-appimage.sh strata-*.AppImage results'

      - name: Upload the screenshot and logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: appimage-test-${{ strategy.job-index }}
          path: results
          if-no-files-found: ignore
